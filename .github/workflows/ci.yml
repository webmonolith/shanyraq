name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: generated.ts is up to date with data/*.json
        run: npm run generate && git diff --exit-code src
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run coverage
      - run: npm run build
      - run: npm run size
      - run: npm run check:pkg
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist

  # Dev tooling needs Node >= 22; the published package promises Node >= 18.
  runtime:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - run: npm run smoke
